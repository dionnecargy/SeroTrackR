url: https://dionnecargy.github.io/SeroTrackR/
authors:
  Dionne Argyropoulos:
    href: https://dionnecargy.github.io/
template:
  bootstrap: 5
  light-switch: yes
  opengraph:
    image:
      src: man/figures/SeroTrackR_sticker.png
  favicons:
  - path: man/figures/logo.png
    rel: icon
    type: image/x-icon
development:
  mode: auto
navbar:
  structure:
    left:
    - intro
    - reference
    - articles
    - tutorials
    - news
    right:
    - search
    - github
    - lightswitch
reference:
- title: Global Functions
- subtitle: Pipelines
  desc: Functions that contain entire processing pipelines.
  contents: ends_with("Pipeline")
- title: Data Processing
- subtitle: Plate Handling
  desc: Process raw Luminex data and plate layouts.
  contents:
  - readSeroData
  - readPlateLayout
  - getPlateLayout
- subtitle: Quality Control
  desc: Quality control checking functions.
  contents:
  - matches("Counts")
  - getRepeats
  - getSampleID
  - plotBlanks
  - plotCounts
  - plotMFI
  - plotModel
  - plotModel_Adj
  - plotRAU
  - starts_with("plotStds")
  - processPkPfPv
  - renderQCReport
- subtitle: MFI to RAU Conversion
  desc: Functions for converting MFI to RAU.
  contents: matches("MFItoRAU")
- title: Machine Learning Algorithm
- subtitle: Classification
  desc: Classify serological data.
  contents:
  - starts_with("classify")
  - plotBoxPlotClassification
  - renderClassificationTable
- title: Internals
- subtitle: Internal helpers
  desc: Internal functions and helpers.
  contents:
  - checkPlatform
  - starts_with("convert")
  - fit_standard_curve
  - getGithubRelease
  - makeCard
  - relabel_columns
  - renderReport
  - renderTwoCols
  - renderDetailsList
  - starts_with("example")

