url: https://dionnecargy.github.io/SeroTrackR/
authors:
  Dionne Argyropoulos:
    href: https://dionnecargy.github.io/
template:
  bootstrap: 5
  light-switch: yes
  opengraph:
    image:
      src: man/figures/SeroTrackR_sticker.png
  favicons:
  - path: man/figures/logo.png
    rel: icon
    type: image/x-icon
development:
  mode: auto
home:
  sidebar:
    structure:
    - status
    - links
    - license
    - citation
    - authors
    components:
      status:
        title: Status
        text: |
          [![DOI](https://zenodo.org/badge/1016494729.svg)](https://doi.org/10.5281/zenodo.23095199)
          [![CRAN status](https://www.r-pkg.org/badges/version/SeroTrackR)](https://CRAN.R-project.org/package=SeroTrackR)
          [![R-CMD-check-CRAN](https://github.com/dionnecargy/SeroTrackR/actions/workflows/R-CMD-check-CRAN.yaml/badge.svg)](https://github.com/dionnecargy/SeroTrackR/actions/workflows/R-CMD-check-CRAN.yaml)
          [![CRAN downloads per month](https://cranlogs.r-pkg.org/badges/SeroTrackR)](https://CRAN.R-project.org/package=SeroTrackR)
          [![CRAN downloads total](https://cranlogs.r-pkg.org/badges/grand-total/SeroTrackR)](https://CRAN.R-project.org/package=SeroTrackR)
articles:
- title: Getting started
  contents:
  - setup
- title: Fit-for-purpose tool
  contents:
  - PvSeroApp_R_Tutorial
- title: Malaria-specific tools
  contents:
  - PvLDH_Tutorial
  - Pk_Pv_Pf_Serology_Tutorial
- title: Other
  contents:
  - FAQs
navbar:
  structure:
    left:
    - intro
    - reference
    - articles
    - tutorials
    - news
    right:
    - search
    - github
    - lightswitch
reference:
- title: Global Functions
- subtitle: Pipelines
  desc: Functions that contain entire processing pipelines.
  contents: ends_with("Pipeline")
- title: Data Processing
- subtitle: Plate Handling
  desc: Process raw Luminex data and plate layouts.
  contents:
  - readSeroData
  - readPlateLayout
  - getPlateLayout
- subtitle: Quality Control
  desc: Quality control checking functions.
  contents:
  - runQC
  - getRepeats
  - starts_with("plot")
  - processPkPfPv
  - renderQCReport
- subtitle: MFI to RAU Conversion
  desc: Functions for converting MFI to RAU.
  contents: matches("MFItoRAU")
- title: Machine Learning Algorithm
- subtitle: Classification
  desc: Classify serological data.
  contents:
  - starts_with("classify")
  - plotBoxPlotClassification
  - renderClassificationTable
- title: Internals
- subtitle: Internal helpers
  desc: Internal functions and helpers.
  contents:
  - starts_with(".")
  - getGithubRelease
  - makeCard
  - renderReport
  - renderTwoCols
  - renderDetailsList
  - starts_with("example")
