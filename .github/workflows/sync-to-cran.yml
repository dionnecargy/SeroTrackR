name: Sync to CRAN Branch

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  sync-cran:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch all branches
        run: git fetch origin

      - name: Checkout CRAN branch from remote
        run: git checkout -b CRAN origin/CRAN

      - name: Set CRAN environment
        run: echo "CRAN_SUBMISSION=true" >> $GITHUB_ENV

      - name: Merge master into CRAN
        run: git merge origin/master --no-ff -m "Auto-sync from master"

      - name: Remove pkgdown-related files and oversized data
        run: |
          rm -rf docs/ inst/hex/ inst/tutorials/ _pkgdown.yml .github/workflows/pkgdown.yaml
          # Exceeds CRAN's 5 MB size limit; package code downloads it from
          # master at runtime when the local file is absent
          rm -f inst/extdata/PvSeroTaTmodel.rds
          git add -A

      - name: Update .Rbuildignore
        run: |
          cat >> .Rbuildignore << 'EOF'
          ^docs$
          ^inst/hex$
          ^inst/tutorials$
          ^_pkgdown.yml$
          ^\.github/workflows/pkgdown\.yaml$
          ^inst/extdata/PvSeroTaTmodel\.rds$
          EOF
          git add .Rbuildignore

      - name: Commit and push
        run: |
          git commit -m "CRAN: Remove pkgdown files and directories" || echo "No changes to commit"
          git push origin CRAN
