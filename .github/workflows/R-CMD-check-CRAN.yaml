# Runs R CMD check --as-cran on the CRAN branch.
# Triggered automatically when the "Sync to CRAN Branch" workflow completes
# (GITHUB_TOKEN pushes don't trigger workflows, so workflow_run is used),
# on manual pushes to CRAN, and on demand.
on:
  workflow_run:
    workflows: ["Sync to CRAN Branch"]
    types: [completed]
  push:
    branches: [CRAN]
  workflow_dispatch:

name: R-CMD-check-CRAN

permissions: read-all

jobs:
  R-CMD-check:
    # Skip if the sync workflow failed
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
        with:
          ref: CRAN

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, local::.
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
          build_args: 'c("--no-manual")'
          upload-snapshots: "true"
